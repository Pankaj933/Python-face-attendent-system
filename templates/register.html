<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register User - Automated Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header class="header">

        <h1>Register User</h1>

        <p>
            Add employee details and capture face for attendance.
        </p>

    </header>


    <div class="register-grid">

        <!-- USER DETAILS -->

        <div class="card">

            <h2>User Details</h2>

            <form id="registerForm">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Employee ID</label>

                    <input
                        type="text"
                        id="employee_id"
                        name="employee_id"
                        placeholder="Enter employee ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                    >

                </div>


                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="form-group">

                    <label>Department</label>

                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="Enter department"
                    >

                </div>


                <button
                    type="button"
                    class="btn"
                    onclick="startCamera()"
                >
                    📷 Open Camera
                </button>

            </form>

        </div>


        <!-- CAMERA -->

        <div class="card camera-card">

            <h2>Face Capture</h2>

            <div class="camera-box">

                <video
                    id="video"
                    autoplay
                    playsinline
                ></video>

                <div id="cameraMessage">
                    Camera not started
                </div>

            </div>


            <button
                type="button"
                class="btn capture-btn"
                onclick="captureFace()"
            >
                📸 Capture Face
            </button>
            <button
    type="button"
    class="btn register-btn"
    onclick="registerUser()"
>
    ✅ Register User
</button>


            <canvas
                id="canvas"
                style="display:none;"
            ></canvas>


            <div id="captureMessage"></div>

        </div>

    </div>


    <div class="back-area">

        <a href="/" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</div>


<script src="{{ url_for('static', filename='js/camera.js') }}"></script>

</body>

</html>
